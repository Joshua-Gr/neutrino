name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # versionCode is `git rev-list --count HEAD` and versionName is `git describe`;
          # a shallow clone has neither the history nor the tags.
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      # Every check runs even after an earlier one fails, so one red step cannot hide the rest.
      - name: Detekt
        if: ${{ !cancelled() }}
        run: ./gradlew detekt --no-daemon

      - name: Android Lint
        if: ${{ !cancelled() }}
        run: ./gradlew :app:lintDebug --no-daemon

      - name: Unit tests
        if: ${{ !cancelled() }}
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: Assemble debug APK
        if: ${{ !cancelled() }}
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload debug APK
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
