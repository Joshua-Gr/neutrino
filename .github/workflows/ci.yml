name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # versionCode is `git rev-list --count HEAD` and versionName is `git describe`;
          # a shallow clone has neither the history nor the tags.
          fetch-depth: 0

      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      # Every check runs even after an earlier one fails, so one red step cannot hide the rest.
      - name: Detekt
        if: ${{ !cancelled() }}
        run: ./gradlew detekt --no-daemon

      - name: Android Lint
        if: ${{ !cancelled() }}
        run: ./gradlew :app:lintDebug --no-daemon

      - name: Unit tests
        if: ${{ !cancelled() }}
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: Assemble debug APK
        if: ${{ !cancelled() }}
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload debug APK
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
